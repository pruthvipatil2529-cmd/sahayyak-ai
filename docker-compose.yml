version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahayyak_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./sahayyak.db
      - JWT_SECRET=sahayyak_super_secret_jwt_key_change_in_production_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend/sahayyak.db:/app/sahayyak.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sahayyak_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
